<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.lolgeng.com/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.lolgeng.com/">
<meta property="og:title" content="LOL梗 - 好笑的网络梗合集">
<meta property="og:description" content="收集互联网上好笑的梗，一个梗一个页面，点开就能玩。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤣</text></svg>">
<style>
  :root {
    --bg: #fff8ec;
    --card: #ffffff;
    --ink: #1d0f0a;
    --muted: #7a6a60;
    --line: #f0e2cc;
    --accent: #d62718;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17110e;
      --card: #221a16;
      --ink: #fbefe0;
      --muted: #a8968a;
      --line: #33281f;
      --accent: #ff5a47;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 56px 16px 40px; }
  header h1 { margin: 0; font-size: 36px; letter-spacing: .02em; }
  header h1 span { color: var(--accent); }
  header p { margin: 6px 0 0; color: var(--muted); }
  .list { list-style: none; margin: 36px 0 0; padding: 0; display: grid; gap: 12px; }
  .item {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: inherit; text-decoration: none;
    transition: transform .15s ease, border-color .15s ease;
  }
  .item:hover { transform: translateY(-2px); border-color: var(--accent); }
  .emoji { font-size: 32px; line-height: 1; flex: none; }
  .body { flex: 1; min-width: 0; }
  .name { margin: 0; font-size: 18px; font-weight: 700; }
  .desc { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .tag {
    flex: none;
    font-size: 12px; color: var(--accent);
    border: 1px solid currentColor; border-radius: 999px; padding: 2px 10px;
  }
  footer { margin-top: 48px; color: var(--muted); font-size: 13px; text-align: center; }
  @media (max-width: 420px) { .tag { display: none; } }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>LOL<span>梗</span></h1>
      <p>收集互联网上好笑的梗，一个梗一个页面。</p>
    </header>

    <ul class="list">
      <li>
        <a class="item" href="/event">
          <span class="emoji" aria-hidden="true">🍗</span>
          <div class="body">
            <h2 class="name">疯狂星期四</h2>
            <p class="desc">每周四准时出现的 V 我 50 文学，附带距离下一个周四的倒计时。</p>
          </div>
          <span class="tag">每周四</span>
        </a>
      </li>
    </ul>

    <footer>更多梗持续更新中 · lolgeng.com</footer>
  </div>
</body>
</html>
