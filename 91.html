<style>
  :root {
    --bg: #0c0b10;
    --panel: #16141d;
    --line: #2a2633;
    --text: #f1edf7;
    --dim: #8f88a0;
    --pink: #ff3d7f;
    --pink-deep: #c41f5a;
    --gold: #ffc53d;
    --display: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "JetBrains Mono", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% -10%, #2a1124 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 440px; }
  [hidden] { display: none !important; }

  .card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 32px 24px 24px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
    animation: rise .4s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }

  /* ---------- gate ---------- */
  .lock {
    width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(255,61,127,.12); border: 1px solid rgba(255,61,127,.4);
  }
  .age {
    display: inline-block; font-family: var(--mono); font-weight: 700; font-size: 12px;
    letter-spacing: .12em; color: var(--pink); border: 1px solid var(--pink);
    border-radius: 999px; padding: 3px 12px; margin-bottom: 14px;
  }
  h1 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0 0 12px; letter-spacing: .04em; }
  .lead { color: var(--dim); font-size: 14px; line-height: 1.8; margin: 0 0 18px; }
  .file {
    display: flex; align-items: center; gap: 12px; text-align: left;
    background: #0f0e14; border: 1px dashed var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 22px; font-size: 13px;
  }
  .file small { display: block; color: var(--dim); font-family: var(--mono); font-size: 11px; margin-top: 2px; }
  .file .blur { filter: blur(4px); user-select: none; }
  .btn {
    display: block; width: 100%; border: 0; border-radius: 12px; cursor: pointer;
    font: inherit; font-size: 16px; font-weight: 600; padding: 15px 16px;
    transition: transform .1s, filter .15s;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: linear-gradient(135deg, var(--pink), var(--pink-deep)); color: #fff; box-shadow: 0 8px 24px rgba(255,61,127,.35); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); margin-top: 10px; }
  .btn.ghost:hover { color: var(--text); }
  .meta { margin-top: 16px; font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .meta b { color: var(--text); }

  /* ---------- loading ---------- */
  .bar { height: 8px; background: #0f0e14; border-radius: 999px; overflow: hidden; margin: 22px 0 14px; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--pink), var(--gold)); transition: width .25s; }
  .log { font-family: var(--mono); font-size: 12px; color: var(--dim); text-align: left; min-height: 96px; line-height: 2; }
  .log div::before { content: "› "; color: var(--pink); }

  .back {
    display: inline-block; margin-bottom: 14px;
    font-size: 13px; color: var(--dim); text-decoration: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px;
  }
  .back:hover { color: var(--pink); border-color: var(--pink); }

  /* ---------- result ---------- */
  .portrait {
    position: relative; width: min(200px, 70%); margin: 0 auto 18px;
    background: #fff3dc; border-radius: 16px; padding: 14px 14px 8px;
  }
  .portrait svg { display: block; width: 100%; height: auto; }
  .portrait figcaption { font-family: var(--mono); font-size: 11px; color: #7a6a60; letter-spacing: .08em; margin-top: 4px; }
  .brow { animation: brow 1.1s ease-in-out infinite; }
  @keyframes brow { 0%, 60%, 100% { transform: translateY(0); } 70%, 90% { transform: translateY(-7px); } }
  .stamp {
    position: absolute; top: 12px; right: -22px;
    font-family: var(--display); font-size: 20px; color: var(--pink);
    border: 3px double var(--pink); border-radius: 8px; padding: 0 10px;
    background: rgba(22,20,29,.85);
    transform: rotate(14deg);
    animation: stamp .35s cubic-bezier(.2,1.6,.4,1) .3s both;
  }
  @keyframes stamp { from { transform: rotate(14deg) scale(2.4); opacity: 0; } }
  .kicker { font-family: var(--display); font-size: 22px; color: var(--gold); margin-bottom: 6px; }
  .rank { font-family: var(--display); font-size: 18px; margin: 4px 0 0; }
  .num {
    display: block; font-family: var(--mono); font-weight: 700;
    font-size: clamp(56px, 18vw, 84px); line-height: 1.1; margin: 4px 0;
    background: linear-gradient(180deg, #fff 20%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .type {
    display: inline-block; font-size: 13px; background: rgba(255,197,61,.12); color: var(--gold);
    border-radius: 999px; padding: 4px 12px; margin-top: 8px;
  }
  .roast { color: var(--dim); font-size: 14px; line-height: 1.8; margin: 16px 0 22px; }
  .stats { text-align: left; border-top: 1px solid var(--line); padding-top: 18px; margin-bottom: 22px; }
  .stats h2 { font-size: 13px; font-weight: 600; color: var(--dim); letter-spacing: .08em; margin: 0 0 14px; }
  .row { margin-bottom: 12px; font-size: 13px; }
  .row .lbl { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .row .lbl span:last-child { font-family: var(--mono); color: var(--dim); }
  .row .track { height: 6px; background: #0f0e14; border-radius: 999px; overflow: hidden; }
  .row .track i { display: block; height: 100%; width: 0; border-radius: 999px; transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .actions a { display: block; margin-top: 14px; color: var(--dim); font-size: 13px; text-decoration: none; }
  .actions a:hover { color: var(--gold); }
  .foot { margin-top: 18px; text-align: center; font-size: 12px; color: #5d5768; line-height: 1.7; }

  .toast {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--text); color: var(--bg); font-size: 14px; font-weight: 600;
    padding: 10px 18px; border-radius: 999px; transition: .25s; max-width: calc(100% - 32px);
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

<div class="toast" id="toast"></div>

<script>
(() => {
  // Counter endpoints served by the site Worker (src/counter.js).
  const API = '/api';
  const STORE = 'rg91';
  const $ = id => document.getElementById(id);
  const t0 = performance.now();

  /* ---------------- counter api ---------------- */
  const hit = key => fetch(API + '/hit', { method: 'POST', body: JSON.stringify({ key }) })
    .then(r => r.ok ? r.json() : Promise.reject(r.status));
  const counts = () => fetch(API + '/counts?keys=91_visit,91_enter,91_leave')
    .then(r => r.ok ? r.json() : Promise.reject(r.status));

  /* ---------------- remember this visitor ---------------- */
  const load = () => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; } };
  const save = v => { try { localStorage.setItem(STORE, JSON.stringify(v)); } catch {} };
  const me = load();
  const firstVisit = !me.visits;
  me.visits = (me.visits || 0) + 1;
  save(me);

  // only the first visit from this browser counts as a new link opener
  let stats = (firstVisit ? hit('91_visit').catch(() => {}) : Promise.resolve())
    .then(counts).catch(() => null);
  stats.then(s => {
    if (s) $('gateVisits').textContent = s['91_visit'].toLocaleString();
    else $('gateMeta').hidden = true;
  });

  /* ---------------- click ---------------- */
  const wait = ms => new Promise(r => setTimeout(r, ms));
  $('enter').onclick = () => choose('enter');
  $('leave').onclick = () => choose('leave');

  async function choose(choice) {
    $('enter').disabled = $('leave').disabled = true;
    const secs = (performance.now() - t0) / 1000;
    let repeat = !!me.type;

    let mine;
    if (repeat) {
      mine = Promise.resolve(me.n);
    } else {
      me.type = choice; me.secs = secs;
      // The server counts one choice per IP; a repeat IP gets its original choice and number back.
      mine = hit(choice === 'enter' ? '91_enter' : '91_leave')
        .then(r => {
          me.n = r.n;
          if (r.dup) { me.type = r.key === '91_enter' ? 'enter' : 'leave'; repeat = true; }
          save(me);
          return r.n;
        })
        .catch(() => { save(me); return null; });
    }
    stats = mine.then(counts).catch(() => null);

    await playLoading(choice);
    const [n, s] = await Promise.all([mine, stats]);
    showResult(n, s, repeat);
  }

  async function playLoading(type) {
    $('gate').hidden = true;
    $('loading').hidden = false;
    const lines = type === 'enter'
      ? ['验证年龄……通过', '解密资源包……', '加载高清画质……', '正在同步到家庭群……', '正在通知你妈……完成']
      : ['检测到正经人……', '核实中……', '核实失败：你点进来了'];
    if (type === 'leave') $('loadTitle').textContent = '请稍候…';
    const step = type === 'enter' ? 520 : 480;
    for (let i = 0; i < lines.length; i++) {
      const d = document.createElement('div');
      d.textContent = lines[i];
      $('log').appendChild(d);
      $('barFill').style.width = Math.round((i + 1) / lines.length * 100) + '%';
      await wait(step);
    }
    await wait(250);
  }

  /* ---------------- result ---------------- */
  function verdict(repeat) {
    const s = me.secs.toFixed(1);
    // a repeat known only to the server means a cleared cache or another browser on the same IP
    const again = me.visits > 1 ? `这是你第 ${me.visits} 次点开这个链接了` : '换了个浏览器也没用，我认得你';
    if (me.type === 'leave') {
      return {
        kicker: '装什么正经 🙄', tail: '位嘴硬的老色批', type: '嘴硬型',
        roast: repeat
          ? `${again}，每次都说自己是正经人。`
          : '正经人看到这个链接根本不会点进来。你不但点了，还认真读完了警告。',
      };
    }
    const tier = me.secs < 1.5 ? ['秒点型', `你只犹豫了 ${s} 秒。回工作消息都没这么快。`]
      : me.secs < 5 ? ['纠结型', `你犹豫了 ${s} 秒，最后还是点了。挣扎过，但没完全挣扎。`]
      : ['深思熟虑型', `你足足思考了 ${s} 秒——深思熟虑之后，你还是选择了做个老色批。`];
    return {
      kicker: repeat ? '又是你？👀' : '抓到了 👀', tail: '位老色批', type: tier[0],
      roast: repeat ? `${again}。还没看够？` : tier[1],
    };
  }

  function showResult(n, s, repeat) {
    const v = verdict(repeat);
    $('loading').hidden = true;
    $('result').hidden = false;
    $('kicker').textContent = v.kicker;
    $('rankTail').textContent = v.tail;
    $('type').textContent = v.type;
    $('roast').textContent = v.roast;
    if (repeat) $('stamp').textContent = '老熟人';
    else if (me.type === 'leave') $('stamp').textContent = '嘴硬';

    if (n == null) {
      $('num').textContent = '???';
      $('roast').textContent += ' （计数器开小差了，但我们都知道你是。）';
    } else {
      countUp($('num'), n);
      $('caseNo').textContent = '鉴定编号 No.' + String(n).padStart(4, '0');
    }

    if (!s) { $('stats').hidden = true; return; }
    const visit = Math.max(s['91_visit'], s['91_enter'] + s['91_leave'], 1);
    const run = visit - s['91_enter'] - s['91_leave'];
    const rows = [visit, s['91_enter'], s['91_leave'], run];
    const pct = x => Math.round(x / visit * 100);
    ['sVisit', 'sEnter', 'sLeave', 'sRun'].forEach((id, i) => {
      $(id).textContent = `${rows[i].toLocaleString()} 人 · ${pct(rows[i])}%`;
    });
    const bars = document.querySelectorAll('.row .track i');
    requestAnimationFrame(() => requestAnimationFrame(() =>
      bars.forEach((b, i) => { b.style.width = pct(rows[i]) + '%'; })));
  }

  function countUp(el, to) {
    const start = performance.now(), dur = 900;
    (function tick(now) {
      const p = Math.min((now - start) / dur, 1);
      el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))).toLocaleString();
      if (p < 1) requestAnimationFrame(tick);
    })(start);
  }

  /* ---------------- share ---------------- */
  $('share').onclick = async () => {
    const text = `发你个好东西，懂的都懂 👉 ${location.origin}${location.pathname}`;
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch {}
      ta.remove();
    }
    toast('已复制，去坑你的好兄弟吧 😏');
  };

  let toastTimer;
  function toast(msg) {
    $('toast').textContent = msg;
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2200);
  }
})();
</script>
