<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebulink API</title>
<meta name="description" content="Nebulink API">
<link rel="canonical" href="https://www.lolgeng.com/event">
<meta property="og:type" content="website">
<meta property="og:title" content="Nebulink API">
<meta property="og:description" content="Nebulink API">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d5dfc'/%3E%3Cstop offset='1' stop-color='%2322c1ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M19 45V19l26 26V19' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='19' cy='19' r='4.5' fill='%23fff'/%3E%3Ccircle cx='45' cy='45' r='4.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #c8251a;
    --cream: #fff3dc;
    --soft: rgba(255, 243, 220, .7);
    --line: rgba(255, 243, 220, .18);
    --gold: #ffc23d;
    --display: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "JetBrains Mono", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--red);
    color: var(--cream);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  main {
    flex: 1; width: 100%; max-width: 560px; margin: 0 auto;
    padding: clamp(40px, 10vh, 96px) 16px 48px;
    display: flex; flex-direction: column; gap: 28px;
  }

  .countdown { font-family: var(--mono); font-size: 13px; color: var(--soft); letter-spacing: .04em; }
  .countdown b { color: var(--gold); font-weight: 500; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .back { font-size: 13px; color: var(--soft); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
  .back:hover { color: var(--cream); border-color: var(--cream); }

  h1 {
    margin: 0; font-family: var(--display); font-weight: 400;
    font-size: clamp(56px, 16vw, 104px); line-height: 1; letter-spacing: .02em;
  }
  h1 em { font-style: normal; color: var(--gold); }
  .sub { margin: 10px 0 0; font-family: var(--mono); font-size: 12px; letter-spacing: .3em; color: var(--soft); }

  .lore { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 22px 0; }
  .lore .no { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--soft); margin-bottom: 10px; }
  .lore p { margin: 0; font-size: 18px; line-height: 1.75; min-height: 3.5em; transition: opacity .3s; }
  .lore p.fade { opacity: 0; }

  .v50 {
    align-self: flex-start;
    font: inherit; font-size: 20px; font-weight: 600;
    color: var(--red); background: var(--cream);
    border: 0; border-radius: 999px; padding: 14px 32px; cursor: pointer;
    transition: transform .1s, background .15s;
  }
  .v50:hover { background: #fff; }
  .v50:active { transform: scale(.96); }
  .tally { font-size: 14px; color: var(--soft); line-height: 1.9; margin-top: -12px; }
  .tally b { color: var(--gold); font-weight: 600; font-family: var(--mono); }
  .pop {
    position: fixed; pointer-events: none; font-weight: 700; font-size: 18px; color: var(--gold);
    transform: translateX(-50%); animation: pop .9s ease-out forwards;
  }
  @keyframes pop { from { opacity: 1; } to { opacity: 0; transform: translate(-50%, -48px); } }

  footer { text-align: center; padding: 0 16px calc(24px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--soft); opacity: .7; }

  .in { animation: in .6s ease-out backwards; }
  .in.d1 { animation-delay: .1s; } .in.d2 { animation-delay: .2s; } .in.d3 { animation-delay: .3s; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main>
  <div class="topbar in">
    <a class="back" href="/">← 全部梗</a>
    <div class="countdown" id="countdown">——</div>
  </div>

  <header class="in d1">
    <h1>疯狂<em>星期四</em></h1>
    <p class="sub">CRAZY THURSDAY · V ME 50</p>
  </header>

  <section class="lore in d2">
    <div class="no" id="loreNo">疯四文学 № 01</div>
    <p id="lore"></p>
  </section>

  <button class="v50 in d3" id="v50">V 我 50</button>
  <div class="tally in d3">
    全网已收到 <b id="sum">¥0</b> · <span id="thanks">等待第一位好心人</span>
    <div id="crowd" hidden>你是第 <b id="visits">—</b> 位路过此地的人</div>
  </div>
</main>
<footer>纯属玩梗 · 每周四准时发疯</footer>

<script>
(() => {
  const $ = id => document.getElementById(id);

  /* ---------------- countdown to next Thursday ---------------- */
  function tick() {
    const now = new Date();
    if (now.getDay() === 4) {
      $('countdown').innerHTML = '<b>就是今天</b> · 疯狂进行中';
      return;
    }
    const next = new Date(now);
    next.setHours(0, 0, 0, 0);
    next.setDate(next.getDate() + ((4 - now.getDay() + 7) % 7));
    let s = Math.floor((next - now) / 1000);
    const d = Math.floor(s / 86400); s %= 86400;
    const pad = n => String(n).padStart(2, '0');
    $('countdown').innerHTML =
      `距下一个周四 <b>${d}天 ${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}</b>`;
  }
  tick(); setInterval(tick, 1000);

  /* ---------------- lore rotation ---------------- */
  const lore = [
    '我是秦始皇，其实我并没有死。今天是疯狂星期四，V我50，朕封你为大将军。',
    '世界上最远的距离，不是生与死，而是星期四已经到了，你还没有 V 我 50。',
    '分手一年，他突然发来消息。我颤抖着点开——“今天疯狂星期四，V我50”。他还记得。',
    '震惊！科学家发现，人类在星期四对鸡腿的渴望会提升 300%，唯一解药是 50 元。',
    '昨晚我梦见自己变成了一只鸡。醒来才明白，是疯狂星期四在召唤我。',
    '你以为这只是一条普通的消息？不，这是一个成年人最后的体面：V我50。',
    '我不是在乞讨，我是在给你一个成为好人的机会。今天限时开放，价格 50。',
  ];
  let li = 0;
  function showLore() {
    $('loreNo').textContent = '疯四文学 № ' + String(li + 1).padStart(2, '0');
    $('lore').textContent = lore[li];
    $('lore').classList.remove('fade');
  }
  showLore();
  setInterval(() => {
    $('lore').classList.add('fade');
    setTimeout(() => { li = (li + 1) % lore.length; showLore(); }, 300);
  }, 6000);

  /* ---------------- V我50 button ---------------- */
  const thanks = ['谢谢老板！', '老板大气！', '鸡腿 +1', '你是好人', '已转告秦始皇', '前任都没你大方', '下周四还来吗', '原味鸡已在路上'];
  // Global tally lives in the site Worker (src/counter.js). Clicks are batched so
  // button mashing doesn't turn into one request per click.
  const API = '/api';
  const hit = (key, n = 1) => fetch(API + '/hit', { method: 'POST', body: JSON.stringify({ key, n }), keepalive: true })
    .then(r => r.ok ? r.json() : Promise.reject(r.status));
  let server = 0, pending = 0, count = 0, flushing = false, flushTimer;
  const total = () => server + pending;
  const showSum = () => { $('sum').textContent = '¥' + (total() * 50).toLocaleString(); };

  hit('event_visit').then(r => {
    $('visits').textContent = r.n.toLocaleString();
    $('crowd').hidden = false;
  }).catch(() => {});
  fetch(API + '/counts?keys=event_v50').then(r => r.ok ? r.json() : Promise.reject())
    .then(r => { server = r.event_v50; showSum(); }).catch(() => {});

  function flush() {
    if (flushing || !pending) return;
    flushing = true;
    const n = Math.min(pending, 20);
    hit('event_v50', n)
      .then(r => { pending -= n; server = r.n; })
      .catch(() => { pending -= n; server += n; })
      .finally(() => { flushing = false; showSum(); if (pending) flushTimer = setTimeout(flush, 400); });
  }
  addEventListener('pagehide', () => {
    if (pending) navigator.sendBeacon(API + '/hit', JSON.stringify({ key: 'event_v50', n: Math.min(pending, 20) }));
  });

  $('v50').addEventListener('click', e => {
    count++; pending++;
    showSum();
    $('thanks').textContent = `你是第 ${total()} 位好心人 · ${thanks[(count - 1) % thanks.length]}`;
    clearTimeout(flushTimer); flushTimer = setTimeout(flush, 800);
    const r = e.currentTarget.getBoundingClientRect();
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.textContent = '+¥50';
    pop.style.left = r.left + r.width / 2 + (Math.random() - .5) * 40 + 'px';
    pop.style.top = r.top - 8 + 'px';
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 900);
  });
})();
</script>
</body>
</html>
